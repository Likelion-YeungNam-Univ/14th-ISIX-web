<svg width="1200" height="140" viewBox="0 0 1200 140"
     xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="CLOSR footer">
  <title>멋쟁이사자처럼 해커톤 ISIX 2026</title>
  <defs>

    <radialGradient id="fbg" cx="50%" cy="60%" r="80%">
      <stop offset="0%"   stop-color="#1a160a"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </radialGradient>

    <!-- Shimmer sweep for text -->
    <linearGradient id="fshimmer" gradientUnits="userSpaceOnUse"
                    x1="-800" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#8a7448"/>
      <stop offset="45%"  stop-color="#c9a96a"/>
      <stop offset="55%"  stop-color="#eedfa0"/>
      <stop offset="65%"  stop-color="#c9a96a"/>
      <stop offset="100%" stop-color="#8a7448"/>
      <animate attributeName="x1" from="-800" to="1200" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0"    to="2000" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Gold divider line gradient -->
    <linearGradient id="fline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c9a96a" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#c9a96a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c9a96a" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <!-- Background -->
  <rect width="1200" height="140" fill="url(#fbg)"/>

  <!-- Waves along the TOP edge (mirrored from banner) -->
  <path fill="#1c1708">
    <animate attributeName="d"
      values="
        M0,34 C160,48 360,20 560,34 C760,48 960,22 1200,34 L1200,0 L0,0 Z;
        M0,28 C180,16 380,44 580,30 C780,16 980,42 1200,28 L1200,0 L0,0 Z;
        M0,34 C160,48 360,20 560,34 C760,48 960,22 1200,34 L1200,0 L0,0 Z"
      dur="8s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
      keyTimes="0;0.5;1"/>
  </path>

  <path fill="#2c2210" opacity="0.75">
    <animate attributeName="d"
      values="
        M0,20 C200,30 420,12 620,20 C820,28 1020,12 1200,20 L1200,0 L0,0 Z;
        M0,16 C220,8 440,26 640,18 C840,10 1040,24 1200,16 L1200,0 L0,0 Z;
        M0,20 C200,30 420,12 620,20 C820,28 1020,12 1200,20 L1200,0 L0,0 Z"
      dur="6s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
      keyTimes="0;0.5;1"/>
  </path>

  <!-- Gold divider line above text -->
  <rect x="380" y="62" width="440" height="1" fill="url(#fline)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Footer text -->
  <text x="600" y="96"
        text-anchor="middle"
        font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"
        font-size="17" letter-spacing="3" fill="url(#fshimmer)">멋쟁이사자처럼 해커톤 ISIX 2026</text>

  <!-- Small gold dot accents -->
  <circle cx="352" cy="90" r="2" fill="#c9a96a">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="848" cy="90" r="2" fill="#c9a96a">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

</svg>
